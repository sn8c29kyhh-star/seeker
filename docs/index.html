<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manual QA Jumpstart - 30-Day Training Plan & Tracker</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="30-Day Day-by-Day Manual QA Training Plan for Fresh Graduates.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Docsify Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">
  
  <style>
    :root {
      --docsify-font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --code-font-family: 'JetBrains Mono', monospace;
      --theme-color: #2563eb;
    }
    body {
      font-family: var(--docsify-font-family);
    }
    code, pre {
      font-family: var(--code-font-family) !important;
    }
    .sidebar {
      font-size: 15px;
    }
    .markdown-section h1 {
      font-weight: 700;
      color: #1e293b;
    }
    .markdown-section h2 {
      font-weight: 600;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.3em;
    }
    .markdown-section table {
      display: table;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      background: rgba(37, 99, 235, 0.05);
      border-radius: 0 6px 6px 0;
      padding: 12px 16px;
    }
  </style>
</head>
<body>
  <div id="app">Loading 30-Day Manual QA Portal...</div>
  <script>
    window.$docsify = {
      name: '🎯 Manual QA 30-Day',
      repo: 'https://github.com/sn8c29kyhh-star/seeker',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: false,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search curriculum & guides...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      pagination: {
        previousText: 'Previous Day',
        nextText: 'Next Day',
        crossChapter: true
      },
      darklightTheme: {
        siteFont: 'Inter',
        defaultTheme: 'light',
        codeFontFamily: 'JetBrains Mono, monospace',
        bodyFontSize: '16px',
        dark: {
          accent: '#60a5fa',
          toogleBackground: '#ffffff',
          background: '#0f172a',
          textColor: '#f8fafc',
          codeTextColor: '#e2e8f0',
          codeBackgroundColor: '#1e293b',
          borderColor: '#334155',
          blockQuoteColour: '#60a5fa',
          sidebarSubView: '#1e293b'
        },
        light: {
          accent: '#2563eb',
          toogleBackground: '#0f172a',
          background: '#ffffff',
          textColor: '#1e293b',
          codeTextColor: '#0f172a',
          codeBackgroundColor: '#f1f5f9',
          borderColor: '#e2e8f0',
          blockQuoteColour: '#2563eb',
          sidebarSubView: '#f8fafc'
        }
      }
    };
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy Code Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Dark/Light Mode Switcher -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <!-- Zoom Image Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- Pagination -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Prism Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
