<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Seeker: a 30-day Manual QA learning path. Learn testing, practise with real tools, and build your portfolio, one day at a time.">
  <meta name="theme-color" content="#153dce">
  <title>Seeker · Manual QA learning path</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="portal.css">
  <script>
    try {
      const theme = localStorage.getItem('seeker-theme');
      document.documentElement.dataset.theme = theme === 'dark' || theme === 'light' ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (localStorage.getItem('seeker-large-text') === 'true') document.documentElement.dataset.largeText = 'true';
    } catch (_) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main" id="skip-link">Skip to lesson</a>
  <header class="site-header">
    <div class="brand-group">
      <button class="menu-button" id="menu-button" type="button" aria-label="Open course navigation" aria-controls="course-sidebar" aria-expanded="false">☰</button>
      <a class="brand" href="#/" aria-label="Seeker home"><span class="brand-mark" aria-hidden="true">s.</span>seeker<span class="brand-dot">/</span></a>
      <span class="header-course">Manual QA learning path</span>
    </div>
    <div class="reading-controls" aria-label="Reading preferences">
      <button type="button" id="text-size" aria-pressed="false" aria-label="Use larger lesson text">Aa<span class="control-label"> Text size</span></button>
      <button type="button" id="theme-toggle" aria-pressed="false" aria-label="Use dark appearance">◐<span class="control-label"> Theme</span></button>
    </div>
  </header>
  <button class="nav-backdrop" id="nav-backdrop" aria-label="Close course navigation" tabindex="-1"></button>
  <div id="app">Loading your learning path…</div>
  <noscript><p class="noscript">Enable JavaScript to read the portal, or <a href="https://github.com/sn8c29kyhh-star/seeker/blob/main/curriculum/overview.md">read the curriculum on GitHub</a>.</p></noscript>
  <div id="save-status" class="sr-only" role="status" aria-live="polite"></div>
  <script>
    window.$docsify = {
      name: 'Your learning path',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 0,
      auto2top: true,
      relativePath: true,
      search: { paths: 'auto', placeholder: 'Search lessons…', noData: 'No lessons found. Try another topic.', depth: 3 },
      copyCode: { buttonText: 'Copy', successText: 'Copied', errorText: 'Select and copy the text' },
      notFoundPage: true
    };
  </script>
  <script src="progress-store.js"></script>
  <script src="portal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js"></script>
</body>
</html>
