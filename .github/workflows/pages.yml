name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "curriculum/**"
      - "README.md"
      - "guides/**"
      - "instructor/**"
      - "scripts/**"
      - "tests/**"
      - "supabase/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate portal
        run: |
          node --check docs/portal.js
          node --check docs/progress-store.js
          node --check docs/workspace.js
          node --test tests/progress-store.test.cjs
          python3 scripts/check-site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sync Curriculum into Docs
        run: |
          rm -rf docs/curriculum docs/guides docs/instructor
          cp -r curriculum docs/curriculum
          cp -r guides docs/guides
          cp -r instructor docs/instructor

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
